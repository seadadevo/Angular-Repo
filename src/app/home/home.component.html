<h2>Home component</h2>
<app-child [userNameFromParent]="userName"></app-child>

<button (click)="changeName()">change</button>

<table class="styled-table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Salary</th>
        </tr>
    </thead>
    <tbody>
        @for(user of homeUsers; track $index;) {
            <tr>
                <td>{{user.name}}</td>
                <td>{{user.age}}</td>
                <td>{{user.gender}}</td>
                <td>{{user.salary}}</td>
            </tr>
           } @empty {
                <tr>
                    <td colspan="4">No users found</td>
                </tr>
            }
        
    </tbody>
</table>
