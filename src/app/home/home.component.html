<div class="movies-container p-5">
  <h2 class="section-title mb-4">🔥 Trending Movies</h2>

  <div class="movies-grid">
    @for (movie of tredingMovies; track $index) {
    <div class="movie-card">
      <div class="poster-wrapper">
        <img
          [src]="imgPrefix + movie.poster_path"
          [alt]="movie.title"
          class="movie-poster"
        />
        <div class="overlay">
          <p class="movie-overview">
            {{
              movie.overview.length > 100
                ? (movie.overview | slice : 0 : 100) + "..."
                : movie.overview
            }}
          </p>
          <div class="footer-card">
            <button class="details-btn">View Details</button>
            <p
              [ngStyle]="{
                'background-color': movie.vote_average > 5 ? 'green' : 'red'
              }"
            >
              {{ movie.vote_average | number:'1.1-1' }}
            </p>
          </div>
        </div>
      </div>
      <h5 class="movie-title mt-2">{{ movie.title }}</h5>
    </div>
    }
  </div>
</div>
