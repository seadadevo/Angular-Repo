
    <div class="item position-relative">
        <a [routerLink]="['/moviedetails', item.id, item.media_type]">
      
      @if(item.poster_path){
        <img class="w-100" [src]="'https://image.tmdb.org/t/p/w500/' + item.poster_path" [alt]="item.title" />
      
      } @else if(item.imgUrl) {
        <img class="w-100" [src]="item.imgUrl" [alt]="item.movieName" />

      } @else if(item.profile_path){
        <img class="w-100" [src]="'https://image.tmdb.org/t/p/w500/' + item.profile_path" [alt]="item.name" />
      
      } @else {
        <img class="w-100 imgageReplace" src="../../assets/images/person.jpg"/>
      }

    <h3 class="h6 my-2">{{ item.movieName || (item.title | watch) || item.name }}</h3> 
      
    </a>
        @if(!item.profile_path){
          <div style="display: flex; align-items: center;gap:10px; justify-content: space-between;">
            @if(!isInWatchlist){
              <button (click)="addItem(item)"
            class="btn btn-outline-warning btn-sm w-100 "
            >Add to Watchlist</button>
            } @else {
              <button (click)="removeItem(item)"
              class="btn btn-sm w-100 removebtn" 
              >remove from Watchlist</button>
            }
          </div>
        }
    </div>
