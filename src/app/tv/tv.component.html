<section class="tv-section py-5">
  <div class="container">
   
    <div class="text-center mb-5">
      <h1 class="fw-bold display-5 text-gradient">Trending TV Shows</h1>
      <p class="text-secondary w-75 mx-auto">
        Explore the most popular series of the week — discover what everyone’s watching now.
      </p>
      <div class="brdr w-25 mx-auto mt-3"></div>
    </div>

    
    <div class="search-bar mb-5 text-center">
      <input
        type="text"
        [(ngModel)]="term"
        (input)="searchTV()"
        placeholder="Search for a TV show..."
        class="input-mine w-75 w-md-50"
      />
    </div>

   
    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-info" role="status"></div>
      <p class="mt-3 text-secondary">Loading top TV shows...</p>
    </div>

    <!-- 🎬 Grid -->
    <div class="row g-4" *ngIf="!isLoading">
      <div class="col-xl-3 col-lg-4 col-md-6" *ngFor="let show of filteredShows">
        <div class="tv-card h-100">
          <div class="poster">
            <img
              [src]="'https://image.tmdb.org/t/p/w500' + show.poster_path"
              [alt]="show.name"
              class="w-100 rounded-top-3"
            />
          </div>
          <div class="info p-3">
            <h5 class="tv-title">{{ show.name }}</h5>
            <p class="text-secondary small m-0">
              {{ show.first_air_date | date:'y' }}
            </p>
            <div class="d-flex justify-content-between align-items-center mt-2">
              <span class="vote">⭐ {{ show.vote_average | number:'1.1-1' }}</span>
              <span class="text-secondary small">Episodes: {{ show.vote_count }}</span>
            </div>
          </div>
        </div>
      </div>

      
      <div *ngIf="!filteredShows.length && !isLoading" class="text-center text-secondary py-5">
        No shows found matching "<strong>{{ term }}</strong>" 😅
      </div>
    </div>
  </div>
</section>
