<section class="tv-section py-5">
  <div class="container">
   
    <div class="text-center mb-5">
      <h1 class="fw-bold display-5 text-gradient">Trending TV Shows</h1>
      <p class="text-secondary w-75 mx-auto">
        Explore the most popular series of the week — discover what everyone’s watching now.
      </p>
      <div class="brdr w-25 mx-auto mt-3"></div>
    </div>

    
    <div class="search-bar mb-5 text-center">
      <input
        type="text"
        [(ngModel)]="term"
        (input)="searchTV()"
        placeholder="Search for a TV show..."
        class="input-mine w-75 w-md-50"
      />
    </div>

   @if(isLoading){
     <div class="text-center py-5">
       <div class="spinner-border text-info" role="status"></div>
       <p class="mt-3 text-secondary">Loading top TV shows...</p>
     </div>
   }

   @if(!isLoading){
     <div class="row g-4">
      @for(item of filteredShows; track $index) {
        <div class="col-xl-3 col-lg-4 col-md-6" >
          <app-mediaitem [item]="item"></app-mediaitem>
        </div>
      }
 
       @if(!filteredShows.length && !isLoading) {
         <div class="text-center text-secondary py-5">
           No shows found matching "<strong>{{ term }}</strong>" 😅
         </div>
       }
     </div>
   }
  </div>
</section>
