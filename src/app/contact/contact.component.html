<div class="row">
    <table class="styled-table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Salary</th>
        </tr>
    </thead>
    <tbody>
        @for(user of galleryUsers; track $index;) {
            <tr>
                <td>{{user.name}}</td>
                <td>{{user.age}}</td>
                <td>{{user.gender}}</td>
                <td>{{user.salary}}</td>
            </tr>
           } @empty {
                <tr>
                    <td colspan="4">No users found</td>
                </tr>
            }
        
    </tbody>
</table>

    <div class="col-md-2">
        <ul>
            <li><a routerLink="/contact">Web</a></li>
            <li><a routerLink="mobile">Mobile</a></li>
        </ul>
    </div>
    <div class="col-md-10">
        <router-outlet></router-outlet>
    </div>
</div>
