<section class="movies py-5">
  <div class="container">
   
    <div class="text-center mb-5">
      <h1 class="fw-bold display-5 text-gradient">Trending Movies</h1>
      <p class="text-secondary w-75 mx-auto">
        Discover the hottest films this week — updated dynamically from TMDB.
      </p>
      <div class="brdr w-25 mx-auto mt-3"></div>
    </div>

  
    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-info" role="status"></div>
      <p class="mt-3 text-secondary">Fetching awesome movies...</p>
    </div>

  
    <div class="row g-4" *ngIf="!isLoading">
      <div class="col-xl-3 col-lg-4 col-md-6" *ngFor="let movie of movies">
        <div class="movie-card h-100">
          <div class="poster">
            <img
              [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path"
              [alt]="movie.title"
              class="w-100 rounded-top-3"
            />
          </div>
          <div class="info p-3">
            <h5 class="movie-title">{{ movie.title }}</h5>
            <div class="d-flex justify-content-between align-items-center">
              <span class="text-secondary small">
                {{ movie.release_date | date:'y' }}
              </span>
              <span class="vote">⭐ {{ movie.vote_average | number:'1.1-1' }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
