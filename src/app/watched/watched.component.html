<section class="watched-hero">
  <div class="container">
    <div class="section-header">
      <h1>My <span>watched</span></h1>
      <p>Your saved movies and shows.</p>
    </div>
  </div>
</section>

<section class="container py-5">
  @if (watchedItems?.length) {
    <div class="row g-4">
      @for (item of watchedItems; track item.movieID) {
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <app-mediaitem [item]="item"></app-mediaitem>
        </div>
      }
    </div>
  } @else {
    <div class="empty-state">
      <div class="empty-card">
        <div class="icon-wrap">
          <i class="bi bi-bookmark"></i>
        </div>
        <h3>Your watched is empty</h3>
        <p>Add movies or shows that you have watched.</p>
        <a routerLink="/movies" class="btn btn-info">Explore Movies</a>
      </div>
    </div>
  }
</section>
